<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="expensestyle.css">
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>Expense Tracker.</h1>
                <p>Manage your money smartly.</p>
            </div>
            <div class="profile">ET</div>
        </header>

        <section class="summary">
            <div class="total-card">
                <p>Total Expenses</p>
                <h2 id="total">₹0.00</h2>
                <span>All your expenses in one place</span>
            </div>
        </section>

        <main class="dashboard">

            <section class="form-section">
                <h2>Add New Expense</h2>

                <form id="expenseForm">

                    <label>Expense Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Shopping"
                        required
                    >

                    <label>Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >

                    <label>Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option>Food</option>
                        <option>Travel</option>
                        <option>Shopping</option>
                        <option>Education</option>
                        <option>Entertainment</option>
                        <option>Other</option>
                    </select>

                    <label>Date</label>
                    <input type="date" id="date" required>

                    <button type="submit">+ Add Expense</button>

                </form>
            </section>

            <section class="expense-section">

                <div class="section-heading">
                    <h2>Recent Expenses</h2>
                    <span id="expenseCount">0 Expenses</span>
                </div>

                <div id="expenseList" class="expense-list">
                    <p class="empty">No expenses added yet.</p>
                </div>

            </section>

        </main>

        <footer>
            <p>Expense Tracker © 2026 | Manage Better, Save Better.</p>
        </footer>

    </div>

    <script src="expensescript.js"></script>

</body>
</html>
